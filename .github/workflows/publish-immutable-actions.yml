name: 'Publish Immutable Action Version'

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checking out
        uses: useblacksmith/checkout@v1
      - name: Publish
        id: publish
        uses: actions/publish-immutable-action@0.0.3
